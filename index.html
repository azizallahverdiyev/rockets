    <title>Rocket Game</title>
    <style>
      
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black; /* Set background to black */
}

canvas {
  display: block;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}


      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .lane {
        height: 90vh;
        width: 1px;
        background-color: white;
      }
      .game {
        position: absolute;
        left: 400px;
        top: 50%;
        transform: translateY(-50%);
      }
      .background {
        background: radial-gradient(circle at bottom, navy 0, black 100%);
        width: 100%;
        height: 100vh;
      }
      h1 {
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 500;
        font-size: 10rem;
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
      }
      svg {
        width: 100px;
        height: auto;
        position: absolute;
        transform: rotate(-45deg);
        transition: all 0.3s linear;
      }
      .win {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 500;
        font-size: 9rem;
        text-align: center;
      }
      *, *::before, *::after  {
  box-sizing: border-box;
}

.gameover {
  width: 100vw;
  height: 100vh;
  position: absolute;
  z-index: 9999999999999999999;
  background-color: #333333;
  display: none;
  align-items: center;
  justify-content: center;
  text-align: center;
}




.questionbox {
  background-color: #333333;
  position: absolute;
  right: 0;
  z-index: 999;
  width: 50vw;
  height: 100vh;
  
}
.thequestion {
  position: absolute;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  font-size: 3rem;
  text-align: center;
}
.variants {
  width: 80%;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: repeat(1, 1fr);
  padding: 20px 10px;
  row-gap: 10px;
  bottom: 150px;
  
}
.variant {
  position: relative;
  width: 100%;
  height: 70px;
  border-radius: 16px;
  cursor: pointer;
  padding: 0 20px
}
.variant h1 {
  font-size: 1.8rem;
  cursor: pointer;
}
.winbox {
  height: 100vh;
  width: 100%;
  background-color: #DA4453;
  z-index: 99999999999999999;
  position: absolute;
  display: none;
}
    </style>

    <script>
      const canvas = document.getElementById("starfield");
const ctx = canvas.getContext("2d");

let stars = [];
const layerCount = 3; // 3 layers for parallax
const speeds = [0.05, 0.1, 0.2]; // Slower speeds for distant stars
const baseStarCount = 50; // Base count of stars per layer
let shootingStar = null;

// Generate a random gray color for stars
function getRandomGrayColor() {
  const grayValue = Math.floor(Math.random() * 256);
  return `rgb(${grayValue}, ${grayValue}, ${grayValue})`;
}

// Resize the canvas
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  createStars(); // Recreate stars based on new dimensions
}

// Create the starfield
function createStars() {
  stars = [];
  const scalingFactor = Math.max(canvas.width, canvas.height) / 1000; // Scale star count
  for (let i = 0; i < layerCount; i++) {
    const starCount = Math.floor(baseStarCount * scalingFactor * (i + 1));
    for (let j = 0; j < starCount; j++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * (i + 1) + 0.5, // Larger stars for closer layers
        speed: speeds[i],
        opacity: Math.random(),
        baseOpacity: Math.random() * 0.5 + 0.5, // Base opacity for twinkling
        layer: i, // Track which layer the star belongs to
      });
    }
  }
}

// Update star positions and simulate twinkling
function updateStars() {
  stars.forEach((star) => {
    star.y -= star.speed; // All stars move upward
    star.opacity =
      star.baseOpacity + Math.sin(Date.now() * 0.001 * star.speed) * 0.3; // Smooth twinkle

    // Reset star position when it goes off-screen
    if (star.y < 0) {
      star.y = canvas.height;
      star.x = Math.random() * canvas.width;
    }
  });
}

// Draw the stars
function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Add a dark radial blur gradient background
  const gradient = ctx.createRadialGradient(
    canvas.width / 2,
    canvas.height / 2,
    canvas.width / 8, // Start small for a blur effect
    canvas.width / 2,
    canvas.height / 2,
    canvas.width // Expand to the edges
  );
  gradient.addColorStop(0, "rgba(10, 20, 40, 1)"); // Deep dark blue at the center
  gradient.addColorStop(1, "rgba(0, 0, 0, 1)"); // Black at the edges
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw stars with parallax effect
  stars.forEach((star) => {
    ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
    ctx.fillRect(star.x, star.y, star.size, star.size);
  });
}

// Initialize a shooting star
function createShootingStar() {
  const startX = Math.random() * canvas.width;
  const startY = Math.random() * canvas.height;
  const angle = Math.random() * Math.PI * 2; // Random direction
  const length = Math.random() * 300 + 100; // Random trail length
  const speed = Math.random() * 4 + 2;

  shootingStar = {
    x: startX,
    y: startY,
    length: length,
    speed: speed,
    opacity: 1,
    dx: Math.cos(angle) * speed,
    dy: Math.sin(angle) * speed,
  };

  // Schedule the next shooting star (20–40 seconds for rare appearance)
  const nextAppearance = Math.random() * 20000 + 20000;
  setTimeout(createShootingStar, nextAppearance);
}

// Update shooting star position
function updateShootingStar() {
  if (!shootingStar) return;

  shootingStar.x += shootingStar.dx;
  shootingStar.y += shootingStar.dy;
  shootingStar.opacity -= 0.01;

  if (
    shootingStar.opacity <= 0 ||
    shootingStar.x < 0 ||
    shootingStar.x > canvas.width ||
    shootingStar.y < 0 ||
    shootingStar.y > canvas.height
  ) {
    shootingStar = null; // Remove shooting star
  }
}

// Draw the shooting star
function drawShootingStar() {
  if (!shootingStar) return;

  const gradient = ctx.createLinearGradient(
    shootingStar.x,
    shootingStar.y,
    shootingStar.x - shootingStar.dx * shootingStar.length,
    shootingStar.y - shootingStar.dy * shootingStar.length
  );
  gradient.addColorStop(0, `rgba(255, 255, 255, ${shootingStar.opacity})`);
  gradient.addColorStop(1, `rgba(255, 255, 255, 0)`);

  ctx.beginPath();
  ctx.strokeStyle = gradient;
  ctx.lineWidth = 2;
  ctx.moveTo(shootingStar.x, shootingStar.y);
  ctx.lineTo(
    shootingStar.x - shootingStar.dx * shootingStar.length,
    shootingStar.y - shootingStar.dy * shootingStar.length
  );
  ctx.stroke();
  ctx.closePath();
}

// Animation loop
function animate() {
  updateStars();
  updateShootingStar();
  drawStars();
  drawShootingStar();
  requestAnimationFrame(animate);
}

// Handle resizing
window.addEventListener("resize", resizeCanvas);

// Initialize
resizeCanvas();
createStars();
setTimeout(createShootingStar, Math.random() * 20000 + 20000); // Rare shooting stars
animate();

    </script>
